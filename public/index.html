<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#06080d;--pn:#0e131d;--ln:#1b2333;--tx:#e9eef8;--mu:#74809a;--am:#ffb31f;--rd:#ff3d52;--gr:#20e3a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
header b{font-size:13px;letter-spacing:.18em;color:var(--mu)}
#bal{font-size:18px;font-weight:700}
#hist{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
#hist span{flex:none;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--pn);border:1px solid var(--ln)}
#hist .w{color:var(--gr)}#hist .l{color:var(--rd)}
#stage{position:relative;flex:1;min-height:0;margin:0 12px;border-radius:18px;background:var(--pn);border:1px solid var(--ln);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
#mult{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:64px;font-weight:800;letter-spacing:-.03em;text-shadow:0 0 40px rgba(255,179,31,.35);transition:color .2s}
#sub{position:absolute;left:0;right:0;top:calc(22% + 78px);text-align:center;color:var(--mu);font-size:14px}
#stage.crash{animation:sh .45s}#stage.crash #mult{color:var(--rd);text-shadow:0 0 40px rgba(255,61,82,.5)}
#stage.win #mult{color:var(--gr);text-shadow:0 0 40px rgba(32,227,160,.5)}
@keyframes sh{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
#ctl{padding:12px 16px 14px;display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.row button,.row input{height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
.row input{flex:1;min-width:0;text-align:center;font-size:18px;font-weight:700}
.row .st{width:42px;font-size:20px}
.chips button{flex:1;font-size:13px;color:var(--mu)}
.au button{flex:1;font-size:13px;color:var(--mu)}
.au button.on{color:var(--bg);background:var(--am);border-color:var(--am);font-weight:700}
#go{height:58px;border:0;border-radius:16px;font-size:19px;font-weight:800;color:#1a1000;background:linear-gradient(180deg,#ffc94d,#ff9f0a);box-shadow:0 8px 26px rgba(255,159,10,.28)}
#go.cash{background:linear-gradient(180deg,#4dffc3,#14c98a);color:#02150e;box-shadow:0 8px 26px rgba(32,227,160,.3)}
#go:disabled{opacity:.5}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2a1016;border:1px solid var(--rd);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style></head><body>
<header><b>🚀 CRASH</b><span id="bal" class="num">—</span></header>
<div id="hist"></div>
<div id="stage"><canvas id="cv"></canvas><div id="mult" class="num">1.00x</div><div id="sub">Tikish qo'ying va raketani uchiring</div></div>
<div id="ctl">
<div class="row"><button class="st" id="mn">−</button><input id="bet" class="num" inputmode="numeric"><button class="st" id="pl">+</button></div>
<div class="row chips"><button data-c="min">Min</button><button data-c="h">½</button><button data-c="d">×2</button><button data-c="max">Max</button></div>
<div class="row au" id="au"></div>
<button id="go">🚀 Boshlash</button></div>
<div id="toast"></div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#06080d');tg.setBackgroundColor('#06080d')}catch(e){}
const $=s=>document.querySelector(s),hap=(t,k)=>{try{tg.HapticFeedback[t](k)}catch(e){}};
const fmt=n=>Math.floor(n).toLocaleString('en').replace(/,/g,' ')+'$';
const post=(p,b={})=>fetch('/api/crash/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,initData:tg.initData})}).then(r=>r.json()).catch(()=>({err:'Tarmoq xatosi'}));
let K=.09,st='idle',tb=0,ts=0,bet=0,mn=10,mx=1000,bal=0,auto=0,endM=1,busy=0,parts=[],tip={x:0,y:0,a:0};
const cv=$('#cv'),cx=cv.getContext('2d'),stars=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.3}));
let W=0,H=0;function rs(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function setBet(v){bet=Math.max(mn,Math.min(mx,Math.round(v)||mn));$('#bet').value=bet}
function curM(){return st==='run'?Math.exp(K*(tb+(performance.now()-ts)/1000)):st==='end'?endM:1}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}}
function draw(){cx.clearRect(0,0,W,H);for(const s of stars){cx.fillStyle='rgba(255,255,255,.25)';cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,6.28);cx.fill()}
const m=curM(),t=Math.log(m)/K,T=Math.max(8,t*1.2),M=Math.max(2,m*1.25),px=W*.08,py=H*.12,pw=W-px*2,ph=H-py*2;
const X=tt=>px+tt/T*pw,Y=mm=>H-py-(mm-1)/(M-1)*ph;
if(st!=='idle'||m>1){cx.beginPath();cx.moveTo(X(0),Y(1));for(let i=1;i<=60;i++){const tt=t*i/60;cx.lineTo(X(tt),Y(Math.exp(K*tt)))}
const col=st==='end'&&endM>1&&!\( ('#stage').classList.contains('win')?'#ff3d52':st==='end'&& \)('#stage').classList.contains('win')?'#20e3a0':'#ffb31f';
cx.strokeStyle=col;cx.lineWidth=3.5;cx.shadowColor=col;cx.shadowBlur=14;cx.stroke();cx.shadowBlur=0;
cx.lineTo(X(t),H-py);cx.lineTo(X(0),H-py);const g=cx.createLinearGradient(0,py,0,H);g.addColorStop(0,col+'44');g.addColorStop(1,col+'00');cx.fillStyle=g;cx.fill();
tip.x=X(t);tip.y=Y(m);const dm=Math.exp(K*(t+.05));tip.a=Math.atan2(Y(dm)-tip.y,X(t+.05)-tip.x);
if(st!=='end'||$('#stage').classList.contains('win')){cx.save();cx.translate(tip.x,tip.y);cx.rotate(tip.a+Math.PI/4);cx.font='30px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🚀',0,0);cx.restore()}}
parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.02;cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,3.5,3.5)}cx.globalAlpha=1;
const mt=$('#mult'),f=Math.floor(m*100)/100;mt.textContent=f.toFixed(2)+'x';
if(st==='run'){const g2=$('#go');const tx='💰 Olish  '+fmt(bet*f);if(g2.textContent!==tx)g2.textContent=tx}
requestAnimationFrame(draw)}
function ui(){const g=$('#go');g.className=st==='run'?'cash':'';g.disabled=false;if(st!=='run')g.textContent=st==='end'?'🔁 Yana o\'ynash':'🚀 Boshlash '+fmt(bet);
for(const e of document.querySelectorAll('.chips button,.st,#bet,.au button'))e.disabled=st==='run';$('#bal').textContent=fmt(bal)}
function hist(h){$('#hist').innerHTML=(h||[]).slice().reverse().map(x=>`<span class="num \( {x>=2?'w':x<1.5?'l':''}"> \){x.toFixed(2)}x</span>`).join('')}
function finish(r){if(st==='end')return;st='end';const S=$('#stage');bal=r.bal;endM=r.how==='crash'?r.point:r.mult;hist(r.hist);
if(r.how==='crash'){S.className='crash';$('#sub').textContent='💥 Portladi! −'+fmt(r.bet);burst(tip.x,tip.y,'#ff5a2e',60);hap('notificationOccurred','error')}
else{S.className='win';$('#sub').textContent=(r.how==='auto'?'🤖 Avto-olish  ':'💰 Olindi  ')+'+'+fmt(r.payout-r.bet)+' · raketa '+r.point.toFixed(2)+'x da portlardi';burst(tip.x,tip.y,'#20e3a0',50);hap('notificationOccurred','success')}ui()}
function sync(r){if(r.err)return;if(r.state==='run'){tb=r.t;ts=performance.now()}else if(r.state==='end'&&st==='run')finish(r)}
setInterval(()=>{if(st==='run')post('poll').then(sync)},350);
$('#go').onclick=async()=>{if(busy)return;busy=1;hap('impactOccurred','medium');
if(st==='run'){const r=await post('cash');busy=0;if(r.err)return toast(r.err);if(r.state==='end')finish(r);return}
const r=await post('start',{bet,auto});busy=0;if(r.err)return toast(r.err);
st='run';tb=0;ts=performance.now();bal=r.bal;\( ('#stage').className=''; \)('#sub').textContent='Portlashidan oldin «Olish» ni bosing!';ui()};
\( ('#mn').onclick=()=>{setBet(bet-Math.max(10,Math.round(bet*.1)));ui()}; \)('#pl').onclick=()=>{setBet(bet+Math.max(10,Math.round(bet*.1)));ui()};
$('#bet').onchange=e=>{setBet(+e.target.value);ui()};
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const c=b.dataset.c;setBet(c==='min'?mn:c==='max'?Math.min(mx,bal):c==='h'?bet/2:bet*2);ui()});
function autos(a){\( ('#au').innerHTML=a.map(v=>`<button data-a=" \){v}" class="\( {v===auto?'on':''}"> \){v?(v/10)+'x':'Avto ✕'}</button>`).join('');
document.querySelectorAll('#au button').forEach(b=>b.onclick=()=>{auto=+b.dataset.a;autos(a)})}
(async()=>{rs();draw();const r=await post('state');if(r.err){\( ('#sub').textContent=r.err; \)('#go').disabled=true;return}
K=r.k;mn=r.min;mx=r.max;bal=r.bal;auto=r.auto;setBet(r.bet);autos(r.autos);hist(r.hist);
if(r.active){st='run';tb=r.active.t;ts=performance.now();setBet(r.active.bet);$('#sub').textContent='Raund davom etmoqda'}ui()})();
</script></body></html>
